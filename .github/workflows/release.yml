name: Build & release Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ("v$pkg" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != desktop/package.json version v$pkg" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt "pyinstaller>=6.11"

      - name: Logo and icons
        run: python scripts/apply_logo.py

      - name: Build studio UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Freeze backend
        run: python -m PyInstaller --noconfirm --clean --distpath build --workpath build/pyi-work packaging/stick-backend.spec

      - name: Build installer and publish GitHub Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx electron-builder --win nsis --publish always

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: desktop/dist/*.exe
