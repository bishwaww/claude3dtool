<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' file:" />
    <title>Stick Knowledge 3D Studio</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1917; color: #eceae4;
        font-family: "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      img { width: 84px; height: 84px; border-radius: 20px; }
      h1 { font-size: 17px; font-weight: 600; margin: 0; }
      #status { font-size: 12px; color: #9c988f; white-space: pre-wrap; text-align: center; max-width: 360px; line-height: 1.5; }
      #status.error { color: #f3a6a6; -webkit-app-region: no-drag; user-select: text; }
      .bar { width: 160px; height: 3px; background: #2a2825; border-radius: 3px; overflow: hidden; }
      .bar div { width: 40%; height: 100%; background: #d97757; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
      .ver { position: absolute; bottom: 10px; font-size: 10px; color: #5f5c56; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="assets/icon.png" alt="" />
      <h1>Stick Knowledge 3D Studio</h1>
      <div class="bar" id="bar"><div></div></div>
      <div id="status">Starting…</div>
    </div>
    <div class="ver" id="ver"></div>
    <script>
      document.getElementById('ver').textContent = 'v' + (new URLSearchParams(location.search).get('version') || '');
      window.setStatus = (text, isError) => {
        const s = document.getElementById('status');
        s.textContent = text;
        s.className = isError ? 'error' : '';
        if (isError) document.getElementById('bar').style.display = 'none';
      };
    </script>
  </body>
</html>
