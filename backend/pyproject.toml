    "anthropic>=0.40.0",
    "httpx>=0.27.2",
    "websockets>=13.1",
    "pillow>=11.0.0",
    "python-multipart>=0.0.12",
    "gradio_client>=1.4.0",
    "aiofiles>=24.1.0",
]
